production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 7
  refresh_models:
    class: RefreshModelsJob
    queue: default
    schedule: every hour at minute 8

  # == Persistent Agent Scheduled Runs ==
  #
  # To schedule an agent, uncomment and set the agent ID.
  # The job is idempotent — it skips inactive agents and missing IDs.
  #
  # Find agent IDs: Agent.where(schedule: not_nil).pluck(:id, :identifier, :schedule)
  #
  # Example: run "manager" agent weekdays at 9am
  #
  # agent_manager_daily:
  #   class: AgentScheduledRunJob
  #   args: [1]  # Replace with your agent's numeric ID
  #   schedule: "every weekday at 9am"